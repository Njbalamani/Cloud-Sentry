services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudsentry
      POSTGRES_USER: cloudsentry
      POSTGRES_PASSWORD: cloudsentry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentry -d cloudsentry"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cloudsentry:cloudsentry@db:5432/cloudsentry
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed_rules &&
      python manage.py seed_controls &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
