{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server error · CloudSentry</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell error-shell">
    <section class="auth-card glass-panel">
      <span class="brand-mark">CS</span>
      <span class="eyebrow">ERROR 500</span>
      <h1>Security platform unavailable</h1>
      <p>The request could not be completed. No cloud changes were made.</p>
      <div class="form-actions">
        <a class="button button-primary" href="{% url 'landing' %}">Reload CloudSentry</a>
        <a class="button button-secondary" href="{% url 'accounts:login' %}">Sign in again</a>
      </div>
    </section>
  </main>
</body>
</html>
