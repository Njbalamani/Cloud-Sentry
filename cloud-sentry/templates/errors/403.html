{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied · CloudSentry</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell error-shell">
    <section class="auth-card glass-panel">
      <span class="brand-mark">CS</span>
      <span class="eyebrow">ERROR 403</span>
      <h1>Access denied</h1>
      <p>Your account does not have the required role for this workspace.</p>
      <div class="form-actions">
        <a class="button button-primary" href="{% url 'dashboard:index' %}">Return to dashboard</a>
        <a class="button button-secondary" href="{% url 'accounts:profile' %}">View profile</a>
      </div>
    </section>
  </main>
</body>
</html>
